name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    # driver + gait + harness suites, all of sim/tests (slow included), the sim smoke test,
    # URDF parity and the generated-file checks: CPU only, ~6 min (the sim suite is ~5 of it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false          # nothing in the fast suites reads an LFS file
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: launcher parses (bash -n rocky.sh)
        run: bash -n rocky.sh
      - name: install (MuJoCo pinned by constraints.txt)
        run: pip install -e ".[sim,harness,dev]" -c constraints.txt
      - name: lint (ruff check . — pyflakes + syntax, pyproject [tool.ruff.lint])
        run: ruff check .
      - name: unit suites (driver, gait, harness fast)
        run: python -m pytest driver/tests gait harness -m "not slow" -q
      - name: regenerate the model files (MJCF + URDF) from params
        env:
          MUJOCO_GL: disable  # no display on the runner; nothing here renders
        run: |
          python sim/build_mjcf.py
          python ros2/rocky_description/generate_urdf.py
      - name: committed generated files are current (D052)
        # a params/generator change without the regenerated pebble.xml / URDF fails here
        run: |
          git diff --exit-code sim/pebble.xml \
            ros2/rocky_description/urdf/pebble.urdf ros2/rocky_description/urdf/pebble.urdf.xacro
      - name: committed tools page is current (D056)
        # docs/TOOLS.md is generated from the tool registry (harness/capabilities.py) and the
        # envelope in params.yaml; a registry or params change without the regenerated page
        # fails here (regenerate: python -m harness.capabilities --md --out docs/TOOLS.md)
        run: python -m harness.capabilities --check docs/TOOLS.md
      - name: "sim smoke: the bare wave gait walks (physics + metrics only, no rendering)"
        # run_sim.py exits 1 on a fall or a walk outside its calibrated band (D052);
        # pipefail carries that exit code through tail
        env:
          MUJOCO_GL: disable
        run: |
          set -o pipefail
          python sim/run_sim.py | tail -4
      - name: sim tests (all of sim/tests, slow included)
        run: python -m pytest sim/tests -q
      - name: URDF == MJCF == analytic FK
        env:
          MUJOCO_GL: disable
        run: python sim/check_urdf_parity.py
      - name: harness slow test (physics-backed goto, no rendering)
        run: python -m pytest harness -m slow -q

  changes:
    # PRs only pay for the CAD job when they touch the design pipeline; pushes to
    # main and manual runs always get it. Plain git, no third-party action.
    runs-on: ubuntu-latest
    outputs:
      cad: ${{ steps.diff.outputs.cad }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "cad=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD \
              | grep -qE '^(cad/|ros2/rocky_description/|sim/build_mjcf\.py$|sim/mass_audit\.py$|sim/check_urdf_parity\.py$|pyproject\.toml$|constraints\.txt$|\.github/workflows/ci\.yml$)'; then
            echo "cad=true" >> "$GITHUB_OUTPUT"
          else
            echo "cad=false" >> "$GITHUB_OUTPUT"
          fi

  cad:
    # the parametric CAD check tree (build123d, ~2 min) and the whole design
    # pipeline on top of it: every push to main, and PRs that touch cad/**, the
    # mass/MJCF/URDF generators or the pins
    needs: changes
    if: needs.changes.outputs.cad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false          # every cad/out file is rebuilt below; only the servo reference is read
      - name: fetch the servo reference solid (the one LFS file the CAD checks read)
        run: |
          git lfs install --local
          git lfs pull --include="cad/ref/*.step"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install (build123d + OCCT pinned in the cad extra, MuJoCo by constraints.txt; dev for pytest)
        run: pip install -e ".[sim,cad,dev]" -c constraints.txt
      - name: run_all_checks (every part module, the joint suite, then printability)
        working-directory: cad
        run: python run_all_checks.py
      - name: FEM plumbing (cad/test_fem.py; the solver test skips here, no gmsh / CalculiX on the runner)
        run: python -m pytest cad/test_fem.py -q
      - name: "design-pipeline: CAD -> masses -> MJCF -> URDF -> parity, committed files current (D052)"
        # mass_audit reads the STLs run_all_checks just rebuilt; everything downstream
        # of it must match what is committed, or a CAD edit shipped without its regen.
        # mass_budget.json rounds to 0.1 g of STL volume: the cad extra pins build123d +
        # OCCT so an upstream release cannot move a volume under this check.
        env:
          MUJOCO_GL: disable
        run: |
          python sim/mass_audit.py
          python sim/build_mjcf.py
          python ros2/rocky_description/generate_urdf.py
          python sim/check_urdf_parity.py
          git diff --exit-code sim/mass_budget.json sim/pebble.xml \
            ros2/rocky_description/urdf/pebble.urdf ros2/rocky_description/urdf/pebble.urdf.xacro
