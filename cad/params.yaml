# ============================================================
# Project ROCKY / Pebble — Design Parameters (single source of truth)
# Units: millimeters unless noted.
# VERIFY = measure on real hardware with calipers before printing 5x of anything.
# Read by cad/ (common.params), gait/rocky_model.py (gait, sim, driver, harness,
# bench) and the MJCF / URDF generators.
# ============================================================

meta:
  version: 0.1
  robot: pebble
  params_rev: D064       # bump when a physics-relevant number changes (sim/model_fingerprint notes it).
                         # D064 (2026-10-07, the owner's body-layout picks): the keel tub, the hub
                         # shelf and the righter's hip clamp enter params, and the model: build_mjcf
                         # carries the belly (belly_tub + the shelf's plate box belly_shelf + its three
                         # Ø14 post columns, rocky_model.belly_boxes / belly_posts) and the torso's
                         # <inertial> from sim/mass_budget.json (mass_audit's pose table, every part
                         # weighed from its STL), so the robot hash moved 87215110e9c4 -> deae868522cc
                         # (c10b970d2bb2 was the provisional budget on the shelf's hull box); the 9q
                         # review's shell relief over the docked cup's back wall (part_shell
                         # cup_back_relief, -69 mm^3 a sector, torso 1555.2 -> 1555.0 g) -> c3e82f13b671
                         # -> 965f4f70e5d1 (the (±40, 20) tab holes back to Ø2.8, +0.02 g of deck, B155:
                         # the torso still 1555.0 g, its inertia moved in the 8th decimal)

# ------------------------------------------------------------
# D052 (2026-09-24): ONE place for what the actuators ARE and what the joints
# may DO. Before this the servo identity was copied into 5+ files and they
# disagreed (stall 2.94 in build_mjcf, velocity 5.2 in the URDF, 4.7 in
# servo_model, 5.0 in the recover env, 55 vs 60 g). Every consumer now goes
# through gait/rocky_model.py. The YAML anchors (&name / *name) are the
# aliases: old keys (bus.soft_limits_deg, mass_hw.servo_st3215,
# servo_st3215.mass_g) point HERE, they are not second copies.
# ------------------------------------------------------------
actuators:
  st3215:                # Feetech STS3215 / Waveshare ST3215 — the 15 leg joints
    stall_nm_12v: 2.94   # 30 kg.cm at 12 V (datasheet, D002). VERIFY on bench/torque_step.
                         # D052 amendment (owner, 2026-09-24): a position servo's INSTANTANEOUS
                         # torque is its stall torque — the MJCF forcerange and the URDF effort
                         # are this number (peak), not the continuous one below
    no_load_rad_s: &st3215_no_load 4.7   # 0.222 s / 60 deg no-load at 12 V (datasheet)
                         # with damping = stall / no-load the sim's DC line gives an unloaded joint
                         # 4.7 rad/s with the motor at stall and 3.05 rad/s with it held to the
                         # continuous torque (= joints.vel_rad_s.loaded; rocky_model.dc_speed)
    continuous_frac: 0.65  # THERMAL (sustained) budget x stall: what it can HOLD for minutes.
                           # NOT an instantaneous cap (D052 amendment) — sustained load above it
                           # heats the RL envs' thermal proxy and trips pebble_feasibility's
                           # THERMAL_LOAD verdict. A guess from hobby-servo practice, not a
                           # datasheet number — VERIFY with a 10-min hold + temp log
    thermal_trip_frac: 0.85  # sustained load (x stall) that trips the servo's over-temp cut ...
    thermal_trip_s: 180.0    # ... after this long: the driver mock's thermal model (70 C cut at
                             # 85 % load in ~3 min). The proxy budget = (0.85^2 - 0.65^2) x 180 =
                             # 54 s (load-fraction^2 above continuous). VERIFY with the same hold test
    counts_per_rev: 4096   # 12-bit magnetic encoder over 360 deg
    latency_s: 0.02        # sync-write -> servo acts: ~one bus tick (VERIFY with an echo test)
    bus_hz: 50             # sync-write rate the driver runs
    mass_g: &st3215_mass_g 60.0   # incl. horn + screws (spec 55 bare) — VERIFY on a kitchen scale
  scs0009:               # Feetech SCS0009 — the 5 claws (protocol 0, 5-6 V domain, D016)
    stall_nm_6v: 0.23    # VERIFY: ~2.3 kg.cm at 6 V (datasheet-ish; nothing measured)
    no_load_rad_s: 9.5   # VERIFY: ~0.11 s / 60 deg at 6 V
    continuous_frac: 0.65  # same guess as the ST3215 — VERIFY
    counts: 1024         # 10-bit pot over the 300 deg sweep (NOT a full turn)
    sweep_deg: 300
    latency_s: 0.02
    bus_hz: 50
    mass_g: &scs0009_mass_g 13.0  # spec ~12-14 g — VERIFY

joints:                  # soft limits: CAD-validated sweeps (D008) — the MJCF
                         # ranges, the URDF limits and the driver clamp ALL read this
  pos_deg: &joint_pos_deg
    yaw: [-40, 40]
    hip: [-70, 90]
    knee: [-150, -20]
    claw: [0, 55]        # capped until hand v0.3 (see BUILD_LOG 07-28)
  vel_rad_s:             # speed budgets for anything that plans or authors motion
    loaded: 3.0          # a stance joint carrying body weight: the fastest a joint turns with
                         # its motor inside the continuous (thermal) torque, dc_speed(continuous)
                         # = 1.911 / 0.626 = 3.05 rad/s — sustained faster motion under load
                         # costs heat (D052; since the amendment the clip is the peak, so this
                         # is a thermal budget, not a hard stop: at 3.0 rad/s a stall-driven
                         # motor still has ~1.06 N.m for the load)
    free: 4.0            # a swinging (unloaded) leg: ~85 % of no-load, margin for the ramp
    hard: *st3215_no_load  # never command faster than the motor can turn at all

gait:                    # WaveGait(**rocky_model.gait_defaults()) — keys = its kwargs
  body_height: 118.0     # mm, deck plane above the ground (the IK foot point)
  stance_radius: 185.0   # mm, nominal foot circle (BODY frame)
  cycle_time: 2.0        # s. D052: was 1.6 — the 32 mm lift in a 0.32 s swing asked the knee
                         # for 4.62 rad/s at 45 mm/s (free-leg budget 4.0). D063 soft swing: the
                         # envelope is 34.2 mm/s (stride 55 mm there; knee 2.95 rad/s). T 2.2 would
                         # give 39.8 mm/s / 0.215 rad/s (stride 70 mm): not taken, a cadence change
  duty: 0.8              # 4 of 5 feet always down. 0.75 REJECTED (D052): adjacent legs overlap in
                         # swing and the CoM leaves the stance triangle by 59 mm, 25 % of the cycle
  step_height: 24.0      # mm swing lift (was 32). D063: the soft swing (pebble_gait.swing_profile)
                         # peaks its lift speed, 3 h/T_swing, at h/2 = 12 mm, inside the first 15 mm
                         # that count as a LOADED leg (3.0 rad/s): that sets the envelope. More
                         # clearance: T 2.2/h 26 (35.2 mm/s) or T 2.4/h 28 (35.7) keep it

reflex:                  # ReflexSupervisor(gait, **rocky_model.reflex_defaults()) — keys = its kwargs
  gyro_trip: 1.8         # rad/s |gyro_xy| that trips a brace (calibration: sim/experiments/results/pre_d052/push_reflex_results.json)
  gyro_calm: 0.9
  stall_s: 3.0           # D048 stall rule
  stall_tilt_deg: 10.0
  fallen_max_s: 10.0
  right_ramp_s: 1.0      # D052: was 0.6 (5.4 rad/s hip from a righter that left it at +90);
                         # the RIGHTED ramp also stretches to 1.5*max|dq|/loaded speed
  righter_hip_min_deg: -51.05  # pick 13 (2026-10-07), B130: the hip clamp on the righter's
                         # commands for legs 1-4 in FALLEN / RIGHTED only. With the battery mass the
                         # righter folded legs under the keel in 12/200 drops (max 3.06 mm); clamped
                         # here: 0/200 tub contacts, 196/200 righting unchanged, 38-43 % of FALLEN
                         # ticks clipped (bay_w 50; legs 1/4 clear by +0.08, PREP_REPORT_2 s2/s4).
                         # Derived with a 135 mm foot: re-derive for the fitted foot (B131: the
                         # B95 hand on the shortest tube needs >= -24 .. -20 on legs 1/4, -32 on
                         # 2/3 for the tub, -40 for the shelf). NOT a servo limit: never applied in
                         # NORMAL / BRACE (a uniform hip stop above -47.91 switches off the cliff
                         # void guard, B129). Applied (D064 sim) by ReflexSupervisor in FALLEN and
                         # at the RIGHTED ramp's start, on righter_clamp_legs, and in RecoverEnv's
                         # action map for new training runs (contract key hip_floor_deg; the
                         # checkpoints on disk replay their uncut map and the supervisor clamps it)
  righter_clamp_legs: [1, 2, 3, 4]   # pick 13: the legs righter_hip_min_deg applies to (rocky_model.
                         # righter_clamp_legs reads it, the one copy). Leg 0 is out by the pick,
                         # and with recover1 it touched the sim's shelf HULL in 20/20 falls (max 2.93,
                         # at y 70-71 where the real plate ends at 64.3): that hull over-stated the
                         # shelf (one box from bottom_z, grown north by the (26, 64) post pad); the
                         # D064 integration replaced it by the plate box + the three pad columns
                         # (rocky_model.belly_boxes / belly_posts). Re-measure leg 0 there before
                         # widening the set (its zero-margin hip: -57.55 on the hull, -62.5 on
                         # plate + pad)

level:                   # D065 BodyLeveler(gait, **rocky_model.level_defaults()) — keys = its kwargs.
                         # Control, not physics: params_rev and the fingerprint stay
  enabled: false         # master switch at construction; the playground's `level on|off` overrides it per session
  tau_s: 0.6             # s, integral time constant of the plane slope on the filtered IMU tilt error
  filter_s: 1.0          # s, first-order low-pass on the tilt error ahead of the deadband (B162: 0.2 -> 1.0, the only value
                         # measured that holds a noisy IMU's straight flat walk at 0.00 mm of offset; it settles slower)
  deadband_deg: 0.5      # radial deadband on the filtered tilt error: a straight flat walk reads zero offsets (a turn, a stop or a shove past it leaves its plane: the deadband never unwinds it)
  raise_mm: 30.0         # the window: every foot RAISED 0..raise_mm, never lowered (the probe keeps its 30 mm)
  rate_mm_s: 20.0        # a stance foot's offset rate; also the plane's tilt rate, as mm/s at stance_radius
  swing_rate_mm_s: 40.0  # an airborne swing foot's offset rate (inside the 15 mm band a swing foot's is held)
  tilt_max_deg: 30.0     # no integration past this tilt: that is a fall, not a slope
  min_contacts: 3        # foot switches closed for the plane to integrate
  swing_blend: [0.30, 0.70]  # swing progress over which a swing foot's plane point moves lift-off -> touchdown
  rough_r0_mm: 12.0      # B162 sink cap: walking, the probe's roughness (max - min probe_dz over the loaded feet, held) past this caps the body's sink
  rough_r1_mm: 12.0      # B162: the cap falls from the full window's sink (16.6 mm) at r0 to sink_max_mm here (<= r0: a step at r0)
  sink_max_mm: 6.0       # B162: the most the plane may sink the body (c) on rough ground, mm: keeps the belly over a stone
  rough_hold_s: 2.0      # B162: the held roughness decays toward the present reading over this (a peak hold; a planted stance freezes it)

sensing:
  foot_switch:           # the SEA microswitch (KW10) in the foot cartridge, as a force threshold
    close_n: 2.0         # VERIFY: KW10 operating force is ~1-2 N at the lever; the spring
                         # preload in the cartridge adds to it. Guess until benched
    open_n: 1.0          # VERIFY: release force (hysteresis) — a real switch lets go lower than it closes

servo_st3215:            # Feetech STS3215 / Waveshare ST3215, 12V 30kg.cm (STS3250 = same case)
  # v2 (D047, 2026-09-22): every number below was MEASURED on the real servo's
  # STEP model (cad/ref/STS3215_03a.step, SO-ARM100, Apache-2.0) by ray-casting
  # its mesh, replacing the v0.1 guesses (case 32 tall, horn top at 38, horn
  # holes on 0/90/180/270, no rear idler, no connectors). "from STEP" stays
  # VERIFY until a servo is calipered; the two numbers the STEP itself is
  # ambiguous about (horn hole radius, horn thread) are hedged in the parts.
  # Frame: output axis = +Z at the origin, case hangs -X, z=0 = case BOTTOM flat
  # face (the idler/connector face). The horn face is +Z.
  body_l: 45.4           # from STEP (spec sheet says 45.2)
  body_w: 24.8           # from STEP (spec 24.7)
  body_h: 28.8           # from STEP: flat-to-flat (the spec's "32" is rim-to-rim)
  shaft_offset: 10.2     # from STEP: output axis -> case FRONT (short) end (v0.1: 11.25)
  rim:                   # 1.5 mm raised frame on BOTH faces over the rear of the case;
    x0: -35.2            # the four screw holes per face sit in it (rel. axis)
    x1: -6.3
    h: 1.5               # top rim face at 30.3, bottom rim face at -1.5
  plateau:               # gearbox cover on the horn face, proud of the rim
    x0: -35.2
    x1: -11.3
    half_w: 7.0
    h: 2.6               # plateau face at 31.4
  case_screw:            # self-tapper holes in the rims (the SO-ARM100 / Feetech bracket mount)
    y: 10.1
    top_x: [-29.0, -7.8] # horn face, from STEP (rel. axis)
    bot_x: [-32.85, -7.8] # idler face
    pilot_d: 1.5         # hole in the STEP; the kit's self-tapper size is VERIFY (PA2.0?) (spec only)
    clear_d: 2.4         # bracket clearance hole
    head_d: 4.0          # spec only, not read by CAD
  out_boss_d: 9.0        # from STEP: output flange under the horn
  out_boss_h: 1.8        # 28.8 -> 30.6
  horn_d: 20.0           # metal disc horn, from STEP
  horn_t: 2.5            # from STEP: 30.6 -> 33.1 (horn TOP is 33.1 above the case bottom; v0.1 said 38)
  horn_bcd: 14.0         # nominal; the STEP's holes read as 14-16 BCD depending on the probe -> parts use a radial SLOT
  horn_bcd_slot: 1.6     # radial slot length in every horn-bolted part: hole centres r 7.0..8.6 = BCD 14.0..17.2 (covers the STEP's 14.0-15.6 reading with margin)
  horn_pattern_deg: 45   # from STEP: holes at 45/135/225/315 — NOT 0/90/180/270 as v0.1 assumed
  horn_hole_d: 2.5       # from STEP = M3 tap drill; RobotShop's kit list says "M3 x 6 machine screws"
  horn_screw_m: 3        # VERIFY with ONE screw on arrival; if the horn is M2-tapped use M2 + washer in the same slots (spec only)
  horn_screw_clear_d: 3.4
  horn_screw_head_d: 5.8 # counterbore for an M3 pan/button head (an M2 head + M2 washer also seats)
  horn_center_head_d: 5.4
  horn_center_head_h: 1.0
  idler_d: 19.9          # from STEP: rear idler wheel on the case bottom (ships with the servo: "two steering wheels")
  idler_t: 2.1
  idler_gap: 1.2         # case bottom -> idler underside: the disc spans z -1.2 .. -3.3
  idler_boss_d: 6.0      # from STEP: rear axle boss the idler sits on (z -1.2 .. 0)
  idler_center_head_d: 6.0
  idler_center_head_h: 0.6   # to z -3.9
  conn:                  # cable side = the idler face (rel. axis, +-y)
    housing_x: [-29.85, -16.6] # connector housing, 3.3 proud, inside the rim frame
    housing_half_w: 9.15
    housing_h: 3.3
    pins_x: [-15.0, -13.1]     # two 3-pin headers side by side, 3 mm behind the idler edge
    pins_y: [1.5, 8.45]
    pins_h: 5.0
    plug_h: 12.0         # VERIFY: how far a mated plug + wire bend stands off the pin tips
    plug_pad: 1.0        # keep-out margin around the pin rows
  mass_g: *st3215_mass_g # D052 alias of actuators.st3215.mass_g (spec 55 bare; STS3250: 74.5)

servo_scs0009:           # claw servo envelope, read by part_hand.scs0009_dummy (VERIFY)
  body_l: 23.6           # VERIFY
  body_w: 11.8           # VERIFY
  body_h: 23.8           # VERIFY

leg:
  l1_coxa: &l1_coxa 45.0 # yaw axis -> femur pivot axis (horizontal)
  hip_axis_z: &hip_axis_z 61.0  # femur pivot height above the deck plane (D047; was a hard-coded 58 in gait/sim/urdf)
  l2_femur: &l2_femur 95.0  # femur pivot -> knee axis (center to center)
  l3_tibia: &l3_tibia 135.0  # knee axis -> foot contact point
  servo: &leg_servo st3215  # D052: actuators.<servo> drives yaw/hip/knee
  claw_servo: &claw_servo scs0009
  foot:                  # D052: the contact geometry at the end of l3 (part_hand + part_footpad)
    tip_radius: 3.5      # closed-hand cone tip sphere (part_hand.CONE_TIP_R)
    pad_crown: 3.0       # TPU sole under the tip (part_footpad.CROWN)
                         # contact radius r_c = tip_radius + pad_crown = 6.5 mm; the sim's
                         # foot sphere sits r_c BEHIND the l3 point so its surface IS the
                         # IK foot point (it used to be a 13 mm ball centred ON it)
    mu_slide: 0.8        # TPU sole on tile / laminate is ~0.5-0.8; the sim ran 1.2 until D052
                         # (that flattered every turn and push). VERIFY with a tilt-board test
    mu_torsion_m: 0.005  # torsional friction (m, MuJoCo condim 4): a pad twisting on the
                         # floor costs torque, so yaw-in-place is no longer free. A guess
  tibia_tube_od: 10.0    # carbon tube OD (VERIFY purchased tube)
  tibia_tube_id: 8.0     # spec only (tube purchase), not read by CAD
  sea_travel: 7.0        # spring travel in foot cartridge

body:
  circumradius: &body_r 110.0  # pentagon center -> leg station
  deck_t: 4.0            # B27 OPEN: nothing reads this key; the CAD cuts a 6.0 deck
                         # (iface.hook_geometry, part_deck.T, part_port_coupon.T_DECK)
  shell_rim_z: 60.0      # mm above the deck plane: carapace top rim, where a hand shoves
                         # (sim/shove.py lever; part_shell tier 4 tops at 52 + the hatch cap).
                         # D048's number, kept — VERIFY against the printed shell

bus:                     # Feetech TTL bus (D003 one bus, D016 dual protocol)
  baud: 1000000
  leg_ids:                     # leg i: [yaw, hip(femur), knee] = 3i+1..3i+3
    - [1, 2, 3]                # leg 0 (north station, 90 deg)
    - [4, 5, 6]                # leg 1
    - [7, 8, 9]                # leg 2
    - [10, 11, 12]             # leg 3
    - [13, 14, 15]             # leg 4
  hand_ids: [16, 17, 18, 19, 20]   # SCS0009, protocol 0, 5-6 V domain (D016!)
  soft_limits_deg: *joint_pos_deg   # D052 alias of joints.pos_deg (kept: older readers)
  safety:                      # SafetyMonitor limits (founding plan §7, docs/archive/ROCKY_MASTER_PLAN_v1.1.md)
    temp_warn_c: 60
    temp_cut_c: 65
    volt_min_v: 9.9
    volt_max_v: 12.9
    load_warn_pct: 60

# ------------------------------------------------------------
# D053 (2026-09-24): the robot's SHAPE as data — docs/DESIGN_CHANGE_GUIDE.md §9.
# rocky_model.robot() reads this block (and builds exactly this from
# leg/body/bus if it is absent). Every number here is an ALIAS (*name) of a
# key above — nothing is typed twice. Ranges stay in joints.pos_deg (keyed
# by joint name), bus ids in bus.leg_ids / bus.hand_ids; this block only
# links them. Step 1 of 10: the generators read the station angles, the leg
# count and the actuator order from here; the chain itself still reaches
# the MJCF / URDF through their templates (step 2), pinned by
# sim/tests/test_model_consistency.py::test_spec_matches_compiled_links.
# ------------------------------------------------------------
robot:
  legs:
    count: 5
    first_station_deg: 90      # leg 0 north, CCW; station i = first + i*360/count
                               # NOT wrapped: leg 4 is 378 (pebble.xml says euler="0 0 378")
    # station_deg: [...]       # optional explicit list; non-uniform needs allow_asymmetric: true
    station_radius_mm: *body_r
  leg:                         # template instantiated per leg; chain is base -> foot,
                               # offsets in mm in the PARENT joint frame (= the gait's LEG frame)
    chain:
      - {name: yaw,  axis: [0, 0, 1],  offset_mm: [0, 0, 0],                  link: coxa}
      - {name: hip,  axis: [0, -1, 0], offset_mm: [*l1_coxa, 0, *hip_axis_z], link: femur}
      - {name: knee, axis: [0, -1, 0], offset_mm: [*l2_femur, 0, 0],          link: tibia}
    foot: {offset_mm: [*l3_tibia, 0, 0]}   # the IK point; contact geometry stays in leg.foot
    tool: {name: claw, axis: [0, 0, 1], servo: *claw_servo}   # role tool: not in IK / RL action
    servo: *leg_servo          # default per joint; a chain entry may say servo: <actuators key>
    ik: {solver: auto, branch: knee_down}   # auto = analytic iff the chain is yaw + 2 parallel pitches
  overrides: {}                # per-leg / per-joint servo: validate() REFUSES non-empty until a
                               # consumer honours it (DESIGN_CHANGE_GUIDE §9 step 10)

interfaces:              # D020 — see docs/INTERFACES.md. Loads through features
                         # (seats, lips, shoulders), NEVER latches; at I1 the seats take the
                         # shear, the thumbscrews the stance tension (B118) and the hook is
                         # only a catch (hook_foot_gap below). Frozen D020; leg_port revised
                         # 2026-10-07 (body-layout decision 15, below); avionics_tray (I4) and
                         # battery_sled (I5) revised 2026-10-07 (decision 11, the owner's sign-off):
                         # docs/archive/BODY_LAYOUT_PROPOSAL_2026-09-28.md option A (pick 1). hub_shelf and stand are
                         # new: the under-deck layout the CAD parts and the sim's belly share
  leg_port:              # I1: deck <-> coxa base
    # 2026-10-07 revision (body-layout decision 15 = "seats", B117): as frozen in D020 the
    # port could not dock at all. The L's 5.15 foot met a 4.2 slot, and the Ø4 x 8 dowels
    # at (-28, +-19) blocked the pivot even at slots 5.2-7.0 (no rigid path at 0.10
    # clearance, docs/archive/prep-2026-10-01/I1_DOCK_OPTIONS.md). The dowels
    # (dowel_d 4.0, dowel_engage 8.0, dowel_xy) are replaced by two printed 30-deg cone
    # posts that the plate is lowered onto: seat_xy[0]'s socket is the matching cone
    # (locates x, y), seat_xy[1]'s is that cone drawn out +-seat_vee_slack along y, a short
    # V-groove (x only), so x, y and yaw are set once. Docked, z is set by the seats and the
    # inboard pads (the plate's underside is relieved outboard of seat_relief_x0).
    # check_dock.py proves the dock path (in-plane 0.469 on the widest stored path at tilt
    # <= 10; 0.300 in 3D at the lip ends) and the docked fit on the real solids.
    seat_xy: [[-32, 17.3], [-32, -17.3]]  # was dowel_xy [[-28, 19], [-28, -19]]. The sockets'
                                          # mouths leave 1.5 (cone) and exactly 1.20 (vee) of
                                          # plate to its y +-22 edge (I1_DOCK_OPTIONS 7: |y| 17.1
                                          # or mouth 0.2 would add margin, not re-proven) and
                                          # clear the Ø5 rim-screw pockets at (-29, +-10.1)
    seat_r: 2.9                           # post base radius on the deck top
    seat_half_angle: 30.0                 # flank angle from vertical (deg): a lift of dz opens
                                          # the cones by dz * sin 30
    seat_h: 3.0                           # post height above the deck top (< the 4 plate)
    seat_vee_len: 0.0                     # the vee's POST stretch along +y (0: both posts are cones)
    seat_vee_slack: 0.3                   # the vee's SOCKET is the cone's drawn out +-0.3 along y
                                          # (x located, y free for print scale)
    seat_roof: 0.6                        # the socket stops this far under the plate top
    seat_mouth: 0.3                       # socket mouth relief: radius over the post base,
                                          # 0.3 tall over the relieved face (eats elephant foot)
    seat_relief: 0.2                      # one layer off the plate underside, outboard of
    seat_relief_x0: -46.0                 # this x. The designer drew -42.0; -46.0 is the judge's
                                          # graft (decision 15): with the thumbscrews (x -41)
                                          # outboard of the pad edge the seats got 8 % of the
                                          # screw preload, now 30 %. It only removes material
                                          # (34.45 mm^3), so every proven path keeps its
                                          # clearance. The port coupon prints both (-46, -42)
    thumbscrew_m: 3.0                     # spec only (INTERFACES.md), not read by CAD
    thumbscrew_xy: [[-41, 17], [-41, -17]]  # inboard corners: reachable with
                                          # the servo installed (mid-pair was
                                          # NOT — and sat off-pentagon, see
                                          # BUILD_LOG 07-30)
    thumbscrew_head_d: 12.0               # printed knurled head
    hook_lip_w: 24.0                      # tangential width, INBOARD edge
    hook_slot_x: -47.0                    # deck through-slot center (leg-local); was -48.0
                                          # (2026-10-07, decision 15). Widened OUTBOARD only:
                                          # the inboard edge stays -50.1, so the L stays where it
                                          # was (the tray-rail corners sit 2 mm inboard of it)
    hook_slot_w: 6.2                      # slot x-width; was 4.2: the L's 5.15 foot + 2 x 0.3
                                          # + the 7-10 deg tilt the seats need (x -50.1..-43.9)
    hook_stem_gap: 0.55                   # docked gap, the stem to the slot's inboard edge
    plate_ext_half_w: 18.0                # the plate runs inboard to the stem for |y| <= this
                                          # (over the slot and the deck beside it: the inboard
                                          # pads, the stance fulcrum)
    hook_lip_t: 3.0                       # lip down-turn thickness
    hook_foot: 3.5                        # under-deck hook reach (toward -x)
    hook_foot_gap: 1.5                    # docked: the foot top under the deck bottom. A name for
                                          # the old hard-coded value, unchanged: the hook is a
                                          # CATCH for a hanging leg, not a clamp. In stance the
                                          # ground on the leg's foot lifts the plate's outboard
                                          # end, the plate pivots on the inboard pads and the
                                          # thumbscrews carry the tension (568 N per pair in the
                                          # design case, B118); the hook carries nothing
    conn_power: XT30                      # spec only (INTERFACES.md), not read by CAD
    conn_data: JST-XH-5                   # data, GND, 6V, spare, spare (spec only)
  tool_socket:           # I2: SEA stub <-> hand/tool (quarter-turn bayonet)
    stub_d: 10.0                          # = tibia_tube_od (spec only, not read by CAD)
    lug_d: 2.5
    lug_h: 2.2
    lug_z_from_face: 9.0
    entry_len: 6.0
    twist_deg: 90.0
    detent_bump: 0.6
    conn: JST-SH-3                        # 6V, GND, TTL (spec only)
  panel_latch:           # I3: replaceable quarter-turn insert + magnets
    housing_d: 14.0
    housing_pocket_d: 14.3
    housing_t: 6.0
    rotor_cam_rise: 0.8
    throw_deg: 90.0      # spec only (INTERFACES.md), not read by CAD
    magnet_d: 6.0
    magnet_t: 3.0
  avionics_tray:         # I4. Revised 2026-10-07 (decision 11): its pose, its turn, the rail tabs
                         # turned INBOARD and the release (B51). It cannot slide off its rails with
                         # the legs docked anywhere (fact 4: 36 north / 22 south of room at (0, 0))
    plate_w: 84.0
    plate_l: 70.0
    plate_t: 3.0
    rail: 3.0
    bulkhead_w: 70.0
    bulkhead_h: 26.0
    tray_xy: [0.0, 0.0]  # body xy of the plate centre: the only pose clear of the five coxa bases and
                         # yaw servos, with tab holes on the deck's (+-40, -20 / 0 / 20) (B51; was
                         # part_avionics.TRAY_XY (0, -38): 534 + 954 mm^3 into bases 2 and 3)
    tray_rot_deg: 180.0  # bulkhead north, latch tongue south: its I3 strike in the deck at (0, -43)
                         # (part_deck.DECK_HOLES). The tray's own +x, the strike's +x, turns with it
    tray_lift: 2.0       # the rails' channel 2 higher: the tray stands 2 mm over the deck than drawn,
                         # so the M3 heads on the inboard tabs (under the plate now) keep 3.4 (button 1.65)
    lug_release: 16.0    # pick 7: the wings are three 10 mm lugs, the channel lips windowed: slide 16
                         # SOUTH (the latch's slotted strike; north the rails would let it go but the
                         # plate covers the (0, 50) trunk slot and the strike holds it), then lift. The
                         # path is 0 mm^3 against the bases and the fork + hip servo yawed -40..40 with
                         # the carapace OFF; with it on it meets sectors 2-4 and the cap (part_avionics)
    pi_standoff_h: 11.0  # D063 (B90): 6 -> 11, so the IMU fits under the Pi; pick 14 keeps it (on 13 no
                         # USB-A port takes a plug reliably; on 18.5 the Pi fails the 3 mm carapace
                         # rule, B128). part_avionics.PI_STANDOFF_H reads this
    pi_usb_end: '+x'     # pick 14, in the BODY frame (east, toward leg 4): with tray_rot_deg 180 that is
                         # the tray's own -x (part_avionics.PI_BOARD_DX's sign flips). Real Pi 5 STEP:
                         # 6.84 mm 3D to the carapace (-x: 3.56); the lower middle USB-A port takes a
                         # right-angle plug <= 20 long, overmold <= 14 x 7, cable down or south (B128).
                         # The bus adapter runs over the Pi's UART, not USB (pick 14)
  battery_sled:          # I5 (bay VERIFY against the purchased 3S 5200 pack). Revised 2026-10-07
                         # (decision 11): the bay is a part now, option A's keel tub (bay_tub + bay_lid
                         # + bay_door, B84), east-west under the deck, nose (XT60) +x, door -x
    bay_l: 192.0         # tub interior, door face to nose wall (was 175: sled 168 + travel, never a
                         # part; 194 the proposal's, which laid sled and dock_block end to end with no
                         # XT60 mate in between). 2026-10-07, pick 4 (the floating carrier printed into
                         # the tub's nose, part_bay): the mate sets it. From the sled's nose face (x 74
                         # docked): 0.5 to the carrier's mouth, the female 0.5 in, 16 deep (the sled's
                         # male, glued 8.0 proud, telescopes 7.0 over it: VERIFY), 6.0 of lead bend
                         # behind it, 0.3 to the nose wall: interior to 97.3 needed, 97.5 here (0.2 of
                         # slack, part_bay asserts it). So the nose comes in 2.0 (101.9 -> 99.9), not
                         # the ~10 the proposal estimated: the carrier's 22 replaces dock_block's 26, and
                         # the XT60 pair's own 25 of mated length did not shrink
    bay_door_x: -97.5    # the tub's place in x (body x of the end door's OUTER face): the one number
                         # that pins it, because bay_centre is the pack's and the sled stack between
                         # them is part_battery's geometry, not params (the sled's 7 overhang + its 6
                         # tail lip put the sled's tail at -12 - 69 - 13 = -94.0, 0.5 short of the
                         # interior's door face at -94.5: the door's press boss takes that 0.5 and
                         # presses 0.5 more, part_bay). The tub is then x bay_door_x ..
                         # bay_door_x + door_t + bay_l + bay_wall (-97.5 .. 99.9 at bay_l 192; the
                         # interior -94.5 .. 97.5); iface.bay_tub_extent() is that sum, the sim's belly
                         # takes the same one. The DOOR end stays put; bay_l moves the nose. Moving
                         # bay_centre or pack_l does NOT move this: re-pin it (the bay agent's key, with
                         # bay_l)
    bay_w: 50.0          # pick 8 (b): no strap inside the robot, so the sled's 48.8 keeps 0.6 a side.
                         # (a)'s 53 cost the uniform hip cut, the 14 AWG route past leg 4's drop and
                         # half the drop slack (PREP_REPORT_2 s4); it changed no righting outcome
    bay_h: 33.0          # interior (was 30): floor -> the sled at rest 2.10 over it (the 4.0 rail in its
                         # 1.9 groove, part_bay measured; the proposal said 2.25) + sled 3 + pack 25 +
                         # foam pad 2.0 = 32.10 of 33: 0.90 between the pack and the pad
    bay_top_z: -18.0     # pick 2: the tub roof's TOP, body z: the 8 mm layer under the deck bottom (-10)
                         # that carries the leg 2/3 lanes; the hook L reaches -13.76 at any pose (4.24
                         # over the roof; 1.26 in the 5 mm layer). Bottom -18 - 2.0 - 33 - 2.4 = -55.4:
                         # 62.15 mm of ground clearance settled in the sim (62.13 with the mass)
    bay_centre: [-12.0, -20.0]  # body xy of the PACK's centre, docked (the proposal's 'pose'), not the
                         # tub's: its x is bay_door_x's; in y the tub is centred here, y -20 +- (bay_w / 2
                         # + bay_wall) = -47.4 .. 7.4. y -20 is the one east-west band clear of all five
                         # leg drops (fact 3)
    bay_wall: 2.4        # side and nose walls (outer width 54.8)
    bay_floor: 2.4       # carries the two sled rails, integral (sled_rail retires)
    bay_roof: 2.0        # bay_lid; its six Ø8 hanger bosses rise to the deck bottom (part_deck.DECK_HOLES)
    foam_pad_t: 2.0      # pick 8 (b): a 2 mm foam pad under the roof takes the pack's play. No strap
                         # keys on purpose: nothing straps the pack in the robot, and it rides loose
                         # on the sled whenever the sled is out
    nose_chamfer: 10.0   # pick 10: 45-deg plan chamfer (leg length) on the nose's two vertical edges;
                         # the interior follows at 10 - 1.41 to keep the 2.4 wall. The square nose
                         # corners were the only tub-caused stalls in the sim (jamming sideways on
                         # 64-70 mm rubble, R1). 10 was picked for a nose ~10 in (pick 4), where the
                         # whole nose would sit inside the carapace skirt's plan; the carrier brought it
                         # in only 2.0 (bay_l 192, part_bay): the nose-south corner goes r 110.57 ->
                         # 106.67 and still stands 7.76 past the skirt (10.29 unchamfered; north corner
                         # -2.16, inside), measured against part_shell's tier-1 outline. The interior
                         # chamfer is 8.59: 4.21 from the cut-off corners to the carrier, its stop
                         # window, the loop key and the lead room; 2.400 of wall normal to it. The NE
                         # chamfer carries the 14 AWG exit (B133, part_bay). The sim's belly box is
                         # square-nosed: the chamfer itself is unsimulated
    door_t: 3.0          # the end door -x (54.8 x 37.4 x 3, replaces belly_door); its boss presses the
                         # sled's tail lip. Pick 12: ONE I3 latch, its strike in a boss outside the
                         # south wall at the door end (part_bay: boss x -91.5 .. -85.5, y -63.35 ..
                         # -47.4, z -55.4 .. -40.75; the door's ear over it 6 thick, x -97.5 .. -91.5,
                         # so the door prints flat on its outer face), and a hook tab on the door's
                         # north edge. The boss is part_bay's, not a param: the latch_strike cutter
                         # (10.8 x 12.2, r 6.1) in a 14.6 pad, LATCH_REACH + 0.2 = 6.0 deep, >= 1.2 of
                         # wall round the cutter. Its slot faces +x at x -85.7: a Ø5 driver along the
                         # south wall turns it, on the stand too (part_bay measures the path)
    pack_l: 138.0        # VERIFY. Pick 5: kept at the VERIFY maximum (the bought pack is 132)
    pack_w: 44.0         # VERIFY. D062 (B72): 46 -> 44, so the sled (pack + 2 x 2.4 walls = 48.8)
                         # fits bay_w 50; the BOM's soft pack is 43 wide
    pack_h: 25.0         # VERIFY: soft-case packs only; hard cases are ~37 mm and do not fit bay_h
    xt60_float: 0.8
    xt60_panel_mm: [16.2, 8.6, 16.0]   # Amass XT60E-M body W x H x D (sled nose + dock carrier) — VERIFY with calipers
  hub_shelf:             # NEW 2026-10-07 (picks 1, 9, 14): option A's north shelf under the deck: the
                         # harness hub (star board + 12 V node) and the three small boards the tray could
                         # not hold (B108), face-down, hung from three posts. The measured arrangement is
                         # PREP_REPORT_2 s3's 'offtray' (case iii) at bay_w 50: G3 b4b_pack.py (log
                         # pack_50_h3_cradle_f-54.4_c3) + g3_verify, 0 mm^3 against every keep-out,
                         # smallest gap 0.57 (the plate to the drops + 5); K3: 0 mm^3, star to post 0.80
    x: [-56.2, 53.95]    # plan envelope (body): the plate as packed, the union of the five boards'
    y: [12.2, 64.3]      # footprints + their plug / lead halos (2026-10-07: 53.9 / 64.2 -> 53.95 / 64.3, the
                         # union the board poses give; G3 packed on a 0.25 grid and printed .1f, part_
                         # busboard asserts it to 0.11). NOT the proposal's x +-45, y 12..54 (the
                         # boards-up shelf before pick 14): the UBEC hangs to y 64.3, the buck to x 45.95,
                         # the adapter's plug halo to x -56.2. Righting and rubble ran with that old box
                         # (z -38..-10, PREP_REPORT_2 s3): the sim's belly takes this one
    plate_top_z: -36.3   # the up boards stand on it (star top -13.9, 3.9 under the deck)
    plate_t: 3.0         # the packing's plate. Thicker pushes the face-down adapter under bottom_z: it
                         # keeps 4.00 to the stand's lowered crown plate (3.00 at plate_t + 1; part_stand,
                         # B134). The thinnest stand margin is now horizontal: 1.30 from the shelf's
                         # south face to the cradle's north wall (0.85 with the x-stop pin's play taken)
    bottom_z: -54.4      # the face-down adapter's pins: plate underside -39.3 - 15.1; 1.0 over the tub's
                         # bottom (-55.4), so a flat floor meets the tub first
    posts: [[-50.0, 34.0], [50.0, 34.0], [26.0, 64.0]]   # body xy, Ø post_d from the deck bottom to the
                         # plate. Not the proposal's (+-40, 20), (0, 20), (0, 40): those block every
                         # arrangement with the adapter (correction 10). 0.59 to the planar hook envelope
                         # (leg y 12.89 vs the L's 12.3), 0.339 to iface's 'any' envelope with its
                         # HOOK_ROLL_PAD 0.05 (yaw ear 12.86, box 12.35), 0.585 to 'path', 0.885 to
                         # the coxa bases, 3.57 to the drops + 5 (the plate: 0.57)
    post_d: 8.0
    pad_d: 14.0          # the plate's round pad under each post (G3's pads, g3_verify), plate-thick. One key
                         # for part_busboard's plate outline and the sim's post columns (rocky_model.
                         # belly_posts: Ø pad_d over the post's height); review 9q: the sim derived it as
                         # post_d + 6 while the part drew a literal 14
    post_screw: below    # 2026-10-07 (measured here): M3 from BELOW, through the plate and the post into a
                         # blind Ø2.8 thread-forming hole in the deck's underside, 5 deep, 1.0 skin
                         # (part_deck.DECK_HOLES; or a short M3 x 3-4 insert). NOT the proposal's M3 x 16
                         # from the deck top: at (+-50, 34) that head (Ø6, z -4..0) sits under the docked
                         # coxa plate's extension, the inboard pads of the I1 seats fix, 5.41 mm^3 each
                         # (Ø5.5 socket head 2.58), and removing the shelf would mean undocking legs 1
                         # and 4. (26, 64) keeps 1.00 from base 0 but is under a carapace sector: below
                         # too, one direction for all three. The prep's 'screwable' test predates the
                         # plate extension
    node_pattern: 30.5   # pick 9: the 12 V node is a 30.5 x 30.5 FPV-style PDB (M3 on 30.5 square,
                         # >= 6 pad pairs, >= 15 A, no BEC); 36 x 36 board
    star_posts: [34.0, 24.0]  # the 40 x 30 perfboard star's M3 corner pattern (part_busboard, WIRING_HARNESS)
    standoff_h: 5.0      # star and node standoffs over the plate top, as packed (star stack 22.4 = 5 + 1.6
                         # + mated XH 9.8 + lead bend 6; node 12.6 = 5 + 1.6 + flat-soldered leads 6): the
                         # star top -36.3 + 22.4 = -13.9, 3.9 under the deck's underside
    boards:              # the measured poses: [x, y] board centre (body), rot about z, face up = parts
                         # toward the deck on the plate's top, down = under the plate toward the ground.
                         # Envelopes: part_avionics.BOARDS (adapter 42 x 33, stack 15.1; UBEC 43 x 17, 8.2);
                         # the buck's is 27.8 x 20.3 x 10.0, its 1000 uF can lying beside the D24V50F5
                         # (ESTIMATE). Not correction 11's node (-20.2, 38.2) / star (21.8, 34.2) turned
                         # 90: those are case i (bay_w 53, the adapter alone on the shelf)
      bus_adapter: {xy: [-20.2, 28.8], rot_deg: 0, face: down}   # z -54.4 .. -39.3; over the Pi's UART
      buck_5v: {xy: [35.8, 26.2], rot_deg: 90, face: down}       # z -49.3 .. -39.3
      ubec_6v: {xy: [-1.8, 55.8], rot_deg: 0, face: down}        # z -47.5 .. -39.3; open below on the stand
      node_12v: {xy: [-20.8, 36.2], rot_deg: 0, face: up}        # z -36.3 .. -23.7
      star: {xy: [25.2, 28.2], rot_deg: 0, face: up}             # z -36.3 .. -13.9; 0.80 to post (50, 34)
    lanes:               # the leg 2 / 3 looms over the tub, in the 8 mm layer (correction 12; L, LV): 8 x 7
      w: 8.0             # a bare 7-conductor loom fits 5 x 7, a zip-tied one needs 8 x 7
      h: 7.0
      z: [-17.0, -10.0]
      route: [[[45.0, 53.0], [-38.0, 12.0]], [[45.0, 59.8], [-38.0, -30.0]], [[51.8, 59.8], [-53.43, -30.0]]]
                         # A, B, C as [x span, y span] for +x (mirror for -x): A south from the shelf, B the
                         # jog (north of y -38: south of it the lane meets the hook by 10.92 mm^3), C down
                         # to the drop; the riser stays inside the drop keep-out box, the loom leaves the
                         # shelf through its south face. 1.00 to the tub / bosses, 1.755 to the hooks
  stand:                 # NEW 2026-10-07 (B85, option A): stand_crown becomes a U-cradle that holds the
                         # TUB, so the carapace stays on and both tub ends are free (the sled swaps on the
                         # stand). Deck bottom over the floor: 89.4 / 169.4 / 249.4 (base + crown / + 1
                         # section / + 2; was 47 / 127 / 207, really 44 / 124 / 204: the old crown had
                         # no seat); the legs reach 153.3 below the deck bottom to the foot point, 183.5
                         # with the B95 hand (part_stand): two sections free the whole envelope
    cradle_x: [-45.0, 45.0]   # the cradle floor's x span (body), under the tub's middle
    wall_h: 25.0         # the two side walls over the floor (the tub bottom -55.4 -> -30.4)
    wall_t: 3.0          # ESTIMATE (G3 / K3's model). In this tree the north wall's outside keeps 1.30
                         # to the hub shelf (0.85 with the x-stop pin's 0.45 of play taken): wall_t <= 3.8
    tub_clear: 0.5       # each wall's gap to the tub's side: the tub can roll 1.25 deg in it in place,
                         # 2.37 slid by the x-stop pin's 0.45 of play, 2.49 with no pin (the walls' 2 mm
                         # lead-ins; part_stand on part_bay's tub; K3's 2.29 had no lead-in)
    xstop_pin_d: 6.0     # the x stop (proposal s3 risks; the cradle alone holds the tub in y only): a Ø6
                         # nominal pin up from the cradle floor (printed Ø5.4 = - 2 FIT, part_stand) into
                         # a Ø6.3 (+ FIT, part_bay) hole: 0.45 of radial play, under the walls' 0.5
    xstop_xy: [0.0, -20.0]    # ... at body (0, -20) ...
    xstop_hole_depth: 1.5     # ... into a 1.5 blind hole in the tub floor (2.4: 0.9 skin over it). The
                         # pin stands FIT (0.3) less, so the floor, not the pin's tip, carries the robot
  dovetail:              # I6 accessory ring
    base_w: 12.0         # the frozen D020 widths, named for the KEY (part_stand's spigots: 12 at
    crest_w: 8.0         # the root). The I6 ring turns it over (B83, iface.dovetail_male(undercut=
                         # True)): the 8 is the neck at the root, the 12 the outboard face
    depth: 4.0
    segment_len: 24.0

fem:                     # D061: cad/fem_check.py (rocky.sh cad-check --fem) — will a printed part break?
  material: petg         # the structural leg parts (docs/PRINT_PLAN.md)
  petg:                  # printed-part ALLOWABLES, not the filament's lab numbers: a PETG datasheet
                         # (Prusament-class) says ~1500 MPa and ~47 MPa yield along the layers, ~30
                         # across them; walls + infill + real layer bonding take a quarter to a third
                         # off. VERIFY with a pull coupon of each orientation from YOUR printer.
    name: PETG
    E_mpa: 1500.0
    nu: 0.38
    strength_xy_mpa: 35.0     # von Mises allowable (in-plane of the layers)
    strength_z_mpa: 20.0      # tension ACROSS the layers: the way printed parts actually break
  sf_target: 2.0         # pass: covers impacts past stall (a servo back-drives), creep, a weak print
  sf_warn: 1.5           # 1.5..2: print it, but watch that spot
  grip_margin_mm: 1.5    # stresses closer than this to a held / loaded zone are the grip's, not the part's
  mesh:                  # gmsh element size (mm); --fine halves both
    clmax: 2.0
    clmin: 0.5

print:                   # FDM design rules (0.4 mm nozzle); fits get re-filed from the fit ladder
  bed_mm: [250.0, 210.0, 210.0]   # build volume the checks assert (X, Y, Z): a Prusa i3-class
                                  # reference printer — change it for yours
  clearance_fit: 0.30    # mating printed parts
  clearance_press: 0.15  # press-fit seats, finish with light ream (spec only, not read by CAD)
  wall_min: 2.4          # = 6 perimeters at 0.4mm (spec only, not read by CAD)
  screw_m3_clear: 3.4
  screw_m3_tap: 2.8      # thread-forming into plastic
  screw_m2_clear: 2.4    # spec only, not read by CAD
  screw_m25_clear: 2.9   # spec only, not read by CAD
  heatset_m3_d: 4.6      # insert pocket dia
  heatset_m3_h: 5.7
  seat_fit: 0.0          # I1 seat sockets' radial offset over the deck's cone posts (iface.
                         # leg_port_plate_features; 0 = touching, nominal). File it from the port
                         # coupons: the smallest of 0 / 0.1 / 0.2 (port_coupon_plate_relief46 /
                         # _fit10 / _fit20) that docks with no rock and no light under the pads

mass_hw:                 # non-printed masses (g) for the sim mass audit — ALL VERIFY on a kitchen scale
  servo_st3215: *st3215_mass_g    # D052 alias of actuators.st3215.mass_g
  servo_scs0009: *scs0009_mass_g  # D052 alias of actuators.scs0009.mass_g
  battery_3s_5200: 380.0 # typical 3S 5200 mAh LiPo, VERIFY on purchase. Pick 6 (2026-10-07): the owner
                         # kept 380 (the BOM's Zeee pack is 343): the conservative mass for the belly,
                         # the righter (it doubled the tub contacts, B130) and the stand
  electronics_pod: 400.0 # estimate: sensors + compute + bus adapter + wiring
  tibia_tube: 5.0        # Ø10 carbon, ~120 mm
  sea_spring_switch: 4.0 # spring + KW10 + wire
  fasteners_per_leg: 8.0 # M2/M3 + heat-sets + pins
  foot_pad_tpu: 4.0
