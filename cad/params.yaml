# ============================================================
# Project ROCKY / Pebble — Design Parameters (single source of truth)
# Units: millimeters unless noted.
# VERIFY = measure on real hardware with calipers before printing 5x of anything.
# Both the CAD scripts and (later) the URDF xacro read this file.
# ============================================================

meta:
  version: 0.1
  robot: pebble
  params_rev: D052       # bump when a physics-relevant number changes (sim/model_fingerprint notes it)

# ------------------------------------------------------------
# D052 (2026-09-24): ONE place for what the actuators ARE and what the joints
# may DO. Before this the servo identity was copied into 5+ files and they
# disagreed (stall 2.94 in build_mjcf, velocity 5.2 in the URDF, 4.7 in
# servo_model, 5.0 in the recover env, 55 vs 60 g). Every consumer now goes
# through gait/rocky_model.py. The YAML anchors (&name / *name) are the
# aliases: old keys (bus.soft_limits_deg, mass_hw.servo_st3215,
# servo_st3215.mass_g) point HERE, they are not second copies.
# ------------------------------------------------------------
actuators:
  st3215:                # Feetech STS3215 / Waveshare ST3215 — the 15 leg joints
    stall_nm_12v: 2.94   # 30 kg.cm at 12 V (datasheet, D002). VERIFY on bench/torque_step.
                         # D052 amendment (owner, 2026-09-24): a position servo's INSTANTANEOUS
                         # torque is its stall torque — the MJCF forcerange and the URDF effort
                         # are this number (peak), not the continuous one below
    no_load_rad_s: &st3215_no_load 4.7   # 0.222 s / 60 deg no-load at 12 V (datasheet)
                         # with damping = stall / no-load the sim's DC line gives an unloaded joint
                         # 4.7 rad/s with the motor at stall and 3.05 rad/s with it held to the
                         # continuous torque (= joints.vel_rad_s.loaded; rocky_model.dc_speed)
    continuous_frac: 0.65  # THERMAL (sustained) budget x stall: what it can HOLD for minutes.
                           # NOT an instantaneous cap (D052 amendment) — sustained load above it
                           # heats the RL envs' thermal proxy and trips pebble_feasibility's
                           # THERMAL_LOAD verdict. A guess from hobby-servo practice, not a
                           # datasheet number — VERIFY with a 10-min hold + temp log
    thermal_trip_frac: 0.85  # sustained load (x stall) that trips the servo's over-temp cut ...
    thermal_trip_s: 180.0    # ... after this long: the driver mock's thermal model (70 C cut at
                             # 85 % load in ~3 min). The proxy budget = (0.85^2 - 0.65^2) x 180 =
                             # 54 s (load-fraction^2 above continuous). VERIFY with the same hold test
    counts_per_rev: 4096   # 12-bit magnetic encoder over 360 deg
    latency_s: 0.02        # sync-write -> servo acts: ~one bus tick (VERIFY with an echo test)
    bus_hz: 50             # sync-write rate the driver runs
    mass_g: &st3215_mass_g 60.0   # incl. horn + screws (spec 55 bare) — VERIFY on a kitchen scale
  scs0009:               # Feetech SCS0009 — the 5 claws (protocol 0, 5-6 V domain, D016)
    stall_nm_6v: 0.23    # VERIFY: ~2.3 kg.cm at 6 V (datasheet-ish; nothing measured)
    no_load_rad_s: 9.5   # VERIFY: ~0.11 s / 60 deg at 6 V
    continuous_frac: 0.65  # same guess as the ST3215 — VERIFY
    counts: 1024         # 10-bit pot over the 300 deg sweep (NOT a full turn)
    sweep_deg: 300
    latency_s: 0.02
    bus_hz: 50
    mass_g: &scs0009_mass_g 13.0  # spec ~12-14 g — VERIFY

joints:                  # soft limits: CAD-validated sweeps (D008) — the MJCF
                         # ranges, the URDF limits and the driver clamp ALL read this
  pos_deg: &joint_pos_deg
    yaw: [-40, 40]
    hip: [-70, 90]
    knee: [-150, -20]
    claw: [0, 55]        # capped until hand v0.3 (see BUILD_LOG 07-28)
  vel_rad_s:             # speed budgets for anything that plans or authors motion
    loaded: 3.0          # a stance joint carrying body weight: the fastest a joint turns with
                         # its motor inside the continuous (thermal) torque, dc_speed(continuous)
                         # = 1.911 / 0.626 = 3.05 rad/s — sustained faster motion under load
                         # costs heat (D052; since the amendment the clip is the peak, so this
                         # is a thermal budget, not a hard stop: at 3.0 rad/s a stall-driven
                         # motor still has ~1.06 N.m for the load)
    free: 4.0            # a swinging (unloaded) leg: ~85 % of no-load, margin for the ramp
    hard: *st3215_no_load  # never command faster than the motor can turn at all

gait:                    # WaveGait(**rocky_model.gait_defaults()) — keys = its kwargs
  body_height: 118.0     # mm, deck plane above the ground (the IK foot point)
  stance_radius: 185.0   # mm, nominal foot circle (BODY frame)
  cycle_time: 2.0        # s. D052: was 1.6 — the 32 mm lift in a 0.32 s swing asked the knee
                         # for 4.62 rad/s at 45 mm/s (free-leg budget 4.0). Now 2.95; stride 72 mm
  duty: 0.8              # 4 of 5 feet always down. 0.75 REJECTED (D052): adjacent legs overlap in
                         # swing and the CoM leaves the stance triangle by 59 mm, 25 % of the cycle
  step_height: 24.0      # mm swing lift (was 32). The lift's first 15 mm counts as a LOADED leg
                         # (3.0 rad/s); pi*h/T_swing sets the knee. More clearance: T 2.2/h 26 or
                         # T 2.4/h 28 also pass check_gait (slower cadence, longer stride)

reflex:                  # ReflexSupervisor(gait, **rocky_model.reflex_defaults()) — keys = its kwargs
  gyro_trip: 1.8         # rad/s |gyro_xy| that trips a brace (push_reflex_results.json calibration)
  gyro_calm: 0.9
  stall_s: 3.0           # D048 stall rule
  stall_tilt_deg: 10.0
  fallen_max_s: 10.0
  right_ramp_s: 1.0      # D052: was 0.6 (5.4 rad/s hip from a righter that left it at +90);
                         # the RIGHTED ramp also stretches to 1.5*max|dq|/loaded speed

sensing:
  foot_switch:           # the SEA microswitch (KW10) in the foot cartridge, as a force threshold
    close_n: 2.0         # VERIFY: KW10 operating force is ~1-2 N at the lever; the spring
                         # preload in the cartridge adds to it. Guess until benched
    open_n: 1.0          # VERIFY: release force (hysteresis) — a real switch lets go lower than it closes

servo_st3215:            # Feetech STS3215 / Waveshare ST3215, 12V 30kg.cm (STS3250 = same case)
  # v2 (D047, 2026-09-22): every number below was MEASURED on the real servo's
  # STEP model (cad/ref/STS3215_03a.step, SO-ARM100, Apache-2.0) by ray-casting
  # its mesh, replacing the v0.1 guesses (case 32 tall, horn top at 38, horn
  # holes on 0/90/180/270, no rear idler, no connectors). "from STEP" stays
  # VERIFY until a servo is calipered; the two numbers the STEP itself is
  # ambiguous about (horn hole radius, horn thread) are hedged in the parts.
  # Frame: output axis = +Z at the origin, case hangs -X, z=0 = case BOTTOM flat
  # face (the idler/connector face). The horn face is +Z.
  body_l: 45.4           # from STEP (spec sheet says 45.2)
  body_w: 24.8           # from STEP (spec 24.7)
  body_h: 28.8           # from STEP: flat-to-flat (the spec's "32" is rim-to-rim)
  shaft_offset: 10.2     # from STEP: output axis -> case FRONT (short) end (v0.1: 11.25)
  rim:                   # 1.5 mm raised frame on BOTH faces over the rear of the case;
    x0: -35.2            # the four screw holes per face sit in it (rel. axis)
    x1: -6.3
    h: 1.5               # top rim face at 30.3, bottom rim face at -1.5
  plateau:               # gearbox cover on the horn face, proud of the rim
    x0: -35.2
    x1: -11.3
    half_w: 7.0
    h: 2.6               # plateau face at 31.4
  case_screw:            # self-tapper holes in the rims (the SO-ARM100 / Feetech bracket mount)
    y: 10.1
    top_x: [-29.0, -7.8] # horn face, from STEP (rel. axis)
    bot_x: [-32.85, -7.8] # idler face
    pilot_d: 1.5         # hole in the STEP; the kit's self-tapper size is VERIFY (PA2.0?)
    clear_d: 2.4         # bracket clearance hole
    head_d: 4.0
  out_boss_d: 9.0        # from STEP: output flange under the horn
  out_boss_h: 1.8        # 28.8 -> 30.6
  horn_d: 20.0           # metal disc horn, from STEP
  horn_t: 2.5            # from STEP: 30.6 -> 33.1 (horn TOP is 33.1 above the case bottom; v0.1 said 38)
  horn_bcd: 14.0         # nominal; the STEP's holes read as 14-16 BCD depending on the probe -> parts use a radial SLOT
  horn_bcd_slot: 1.6     # extra radial slot length in every horn-bolted part (covers BCD 14.0..15.6)
  horn_pattern_deg: 45   # from STEP: holes at 45/135/225/315 — NOT 0/90/180/270 as v0.1 assumed
  horn_hole_d: 2.5       # from STEP = M3 tap drill; RobotShop's kit list says "M3 x 6 machine screws"
  horn_screw_m: 3        # VERIFY with ONE screw on arrival; if the horn is M2-tapped use M2 + washer in the same slots
  horn_screw_clear_d: 3.4
  horn_screw_head_d: 5.8 # counterbore for an M3 pan/button head (an M2 head + M2 washer also seats)
  horn_center_head_d: 5.4
  horn_center_head_h: 1.0
  idler_d: 19.9          # from STEP: rear idler wheel on the case bottom (ships with the servo: "two steering wheels")
  idler_t: 2.1
  idler_gap: 1.2         # case bottom -> idler underside: the disc spans z -1.2 .. -3.3
  idler_boss_d: 6.0      # from STEP: rear axle boss the idler sits on (z -1.2 .. 0)
  idler_center_head_d: 6.0
  idler_center_head_h: 0.6   # to z -3.9
  conn:                  # cable side = the idler face (rel. axis, +-y)
    housing_x: [-29.85, -16.6] # connector housing, 3.3 proud, inside the rim frame
    housing_half_w: 9.15
    housing_h: 3.3
    pins_x: [-15.0, -13.1]     # two 3-pin headers side by side, 3 mm behind the idler edge
    pins_y: [1.5, 8.45]
    pins_h: 5.0
    plug_h: 12.0         # VERIFY: how far a mated plug + wire bend stands off the pin tips
    plug_pad: 1.0        # keep-out margin around the pin rows
  mass_g: *st3215_mass_g # D052 alias of actuators.st3215.mass_g (spec 55 bare; STS3250: 74.5)

servo_scs0009:           # hand/claw drive (modeled later)
  body_l: 23.6           # VERIFY
  body_w: 11.8           # VERIFY
  body_h: 23.8           # VERIFY

bearing_683zz:           # coxa yaw support bearing 3x7x3
  id: 3.0
  od: 7.0
  w: 3.0

leg:
  l1_coxa: &l1_coxa 45.0 # yaw axis -> femur pivot axis (horizontal)
  hip_axis_z: &hip_axis_z 61.0  # femur pivot height above the deck plane (D047; was a hard-coded 58 in gait/sim/urdf)
  l2_femur: &l2_femur 95.0  # femur pivot -> knee axis (center to center)
  l3_tibia: &l3_tibia 135.0  # knee axis -> foot contact point
  servo: &leg_servo st3215  # D052: actuators.<servo> drives yaw/hip/knee
  claw_servo: &claw_servo scs0009
  foot:                  # D052: the contact geometry at the end of l3 (part_hand + part_footpad)
    tip_radius: 3.5      # closed-hand cone tip sphere (part_hand.CONE_TIP_R)
    pad_crown: 3.0       # TPU sole under the tip (part_footpad.CROWN)
                         # contact radius r_c = tip_radius + pad_crown = 6.5 mm; the sim's
                         # foot sphere sits r_c BEHIND the l3 point so its surface IS the
                         # IK foot point (it used to be a 13 mm ball centred ON it)
    mu_slide: 0.8        # TPU sole on tile / laminate is ~0.5-0.8; the sim ran 1.2 until D052
                         # (that flattered every turn and push). VERIFY with a tilt-board test
    mu_torsion_m: 0.005  # torsional friction (m, MuJoCo condim 4): a pad twisting on the
                         # floor costs torque, so yaw-in-place is no longer free. A guess
  tibia_tube_od: 10.0    # carbon tube OD (VERIFY purchased tube)
  tibia_tube_id: 8.0
  sea_travel: 7.0        # spring travel in foot cartridge

body:
  circumradius: &body_r 110.0  # pentagon center -> leg station
  deck_t: 4.0            # printed deck thickness
  shell_rim_z: 60.0      # mm above the deck plane: carapace top rim, where a hand shoves
                         # (sim/shove.py lever; part_shell tier 4 tops at 52 + the hatch cap).
                         # D048's number, kept — VERIFY against the printed shell

bus:                     # Feetech TTL bus (D003 one bus, D016 dual protocol)
  port_hint: /dev/ttyACM0      # Waveshare Bus Servo Adapter (A) — VERIFY on host
  baud: 1000000
  leg_ids:                     # leg i: [yaw, hip(femur), knee] = 3i+1..3i+3
    - [1, 2, 3]                # leg 0 (north station, 90 deg)
    - [4, 5, 6]                # leg 1
    - [7, 8, 9]                # leg 2
    - [10, 11, 12]             # leg 3
    - [13, 14, 15]             # leg 4
  hand_ids: [16, 17, 18, 19, 20]   # SCS0009, protocol 0, 5-6 V domain (D016!)
  soft_limits_deg: *joint_pos_deg   # D052 alias of joints.pos_deg (kept: older readers)
  safety:                      # SafetyMonitor limits (master plan §7)
    temp_warn_c: 60
    temp_cut_c: 65
    volt_min_v: 9.9
    volt_max_v: 12.9
    load_warn_pct: 60

# ------------------------------------------------------------
# D053 (2026-09-24): the robot's SHAPE as data — docs/ROBOT_AS_DATA.md.
# rocky_model.robot() reads this block (and builds exactly this from
# leg/body/bus if it is absent). Every number here is an ALIAS (*name) of a
# key above — nothing is typed twice. Ranges stay in joints.pos_deg (keyed
# by joint name), bus ids in bus.leg_ids / bus.hand_ids; this block only
# links them. Step 1 of 10: the generators read the station angles, the leg
# count and the actuator order from here; the chain itself still reaches
# the MJCF / URDF through their templates (step 2), pinned by
# sim/tests/test_model_consistency.py::test_spec_matches_compiled_links.
# ------------------------------------------------------------
robot:
  legs:
    count: 5
    first_station_deg: 90      # leg 0 north, CCW; station i = first + i*360/count
                               # NOT wrapped: leg 4 is 378 (pebble.xml says euler="0 0 378")
    # station_deg: [...]       # optional explicit list; non-uniform needs allow_asymmetric: true
    station_radius_mm: *body_r
  leg:                         # template instantiated per leg; chain is base -> foot,
                               # offsets in mm in the PARENT joint frame (= the gait's LEG frame)
    chain:
      - {name: yaw,  axis: [0, 0, 1],  offset_mm: [0, 0, 0],                  link: coxa}
      - {name: hip,  axis: [0, -1, 0], offset_mm: [*l1_coxa, 0, *hip_axis_z], link: femur}
      - {name: knee, axis: [0, -1, 0], offset_mm: [*l2_femur, 0, 0],          link: tibia}
    foot: {offset_mm: [*l3_tibia, 0, 0]}   # the IK point; contact geometry stays in leg.foot
    tool: {name: claw, axis: [0, 0, 1], servo: *claw_servo}   # role tool: not in IK / RL action
    servo: *leg_servo          # default per joint; a chain entry may say servo: <actuators key>
    ik: {solver: auto, branch: knee_down}   # auto = analytic iff the chain is yaw + 2 parallel pitches
  overrides: {}                # per-leg / per-joint servo: validate() REFUSES non-empty until a
                               # consumer honours it (ROBOT_AS_DATA step 10)

interfaces:              # D020 — see docs/INTERFACES.md. Loads through
                         # dowels/lips/shoulders, NEVER latches. FROZEN.
  leg_port:              # I1: deck <-> coxa base
    dowel_d: 4.0
    dowel_engage: 8.0
    dowel_xy: [[-28, 19], [-28, -19]]     # on-deck (r 84.2 < pentagon 88.4)
                                          # and clear of the cradle walls
    thumbscrew_m: 3.0
    thumbscrew_xy: [[-41, 17], [-41, -17]]  # inboard corners: reachable with
                                          # the servo installed (mid-pair was
                                          # NOT — and sat off-pentagon, see
                                          # BUILD_LOG 07-30)
    thumbscrew_head_d: 12.0               # printed knurled head
    hook_lip_w: 24.0                      # tangential width, INBOARD edge
    hook_slot_x: -48.0                    # deck through-slot center (leg-local)
    hook_slot_w: 4.2                      # slot x-width (lip 2.2 + swing room)
    hook_lip_t: 3.0                       # lip down-turn thickness
    hook_foot: 3.5                        # under-deck hook reach (toward -x)
    conn_power: XT30
    conn_data: JST-XH-5                   # data, GND, 6V, spare, spare
  tool_socket:           # I2: SEA stub <-> hand/tool (quarter-turn bayonet)
    stub_d: 10.0                          # = tibia_tube_od
    lug_d: 2.5
    lug_h: 2.2
    lug_z_from_face: 9.0
    entry_len: 6.0
    twist_deg: 90.0
    detent_bump: 0.6
    conn: JST-SH-3                        # 6V, GND, TTL
  panel_latch:           # I3: replaceable quarter-turn insert + magnets
    housing_d: 14.0
    housing_pocket_d: 14.3
    housing_t: 6.0
    rotor_cam_rise: 0.8
    throw_deg: 90.0
    magnet_d: 6.0
    magnet_t: 3.0
  avionics_tray:         # I4
    plate_w: 84.0
    plate_l: 70.0
    plate_t: 3.0
    rail: 3.0
    bulkhead_w: 70.0
    bulkhead_h: 26.0
  battery_sled:          # I5 (bay VERIFY against the purchased 3S 5200 pack)
    bay_l: 175.0         # sled 168 (pack 138 + walls + XT60 nose + tail lip)
                         # + insertion travel — the belly shell cavity length
    bay_w: 50.0
    bay_h: 30.0
    pack_l: 138.0        # VERIFY
    pack_w: 46.0         # VERIFY
    pack_h: 25.0         # VERIFY
    xt60_float: 0.8
  dovetail:              # I6 accessory ring
    base_w: 12.0
    crest_w: 8.0
    depth: 4.0
    segment_len: 24.0

print:                   # old-Prusa-friendly design rules
  clearance_fit: 0.30    # mating printed parts
  clearance_press: 0.15  # press-fit seats (bearings), finish with light ream
  wall_min: 2.4          # = 6 perimeters at 0.4mm
  screw_m3_clear: 3.4
  screw_m3_tap: 2.8      # thread-forming into plastic
  screw_m2_clear: 2.4
  screw_m25_clear: 2.9
  heatset_m3_d: 4.6      # insert pocket dia
  heatset_m3_h: 5.7

mass_hw:                 # non-printed masses (g) for the sim mass audit — ALL VERIFY on a kitchen scale
  servo_st3215: *st3215_mass_g    # D052 alias of actuators.st3215.mass_g
  servo_scs0009: *scs0009_mass_g  # D052 alias of actuators.scs0009.mass_g
  battery_3s_5200: 380.0 # typical 3S 5200 mAh LiPo, VERIFY on purchase
  electronics_pod: 400.0 # sensors + compute + bus adapter + wiring (status log 07-30 audit, lidar-pull variant)
  tibia_tube: 5.0        # Ø10 carbon, ~120 mm
  sea_spring_switch: 4.0 # spring + KW10 + wire
  fasteners_per_leg: 8.0 # M2/M3 + heat-sets + pins
  bearing_683zz: 1.0
  foot_pad_tpu: 4.0
